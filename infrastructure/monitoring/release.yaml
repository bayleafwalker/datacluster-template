---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 55.x
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 12h
  values:
    # Prometheus configuration
    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: "8GB"
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: hcloud-volumes
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        
        # Resource limits (control plane friendly)
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        
        # ServiceMonitor selectors
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
    
    # Grafana configuration
    grafana:
      enabled: true
      adminPassword: admin  # CHANGE THIS or use secret
      
      persistence:
        enabled: true
        storageClassName: hcloud-volumes
        size: 5Gi
      
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      
      # Dashboards
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: 'default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      
      dashboards:
        default:
          kubernetes-cluster:
            gnetId: 7249
            revision: 1
            datasource: Prometheus
          spark-applications:
            gnetId: 12620
            revision: 1
            datasource: Prometheus
          datacluster-spark-workload:
            file: dashboards/spark-workload.json
    
    # Alertmanager (disabled for homelab)
    alertmanager:
      enabled: false
    
    # Node exporter
    nodeExporter:
      enabled: true
    
    # Kube-state-metrics
    kubeStateMetrics:
      enabled: true
    
    # Disable default ServiceMonitors for control plane (Talos doesn't expose these)
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
