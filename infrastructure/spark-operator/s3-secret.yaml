---
# Hetzner Object Storage credentials for Spark
# ENCRYPT WITH SOPS before committing: sops --encrypt --in-place s3-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: spark-operator
type: Opaque
stringData:
  access-key: "REPLACE_HETZNER_S3_ACCESS_KEY"
  secret-key: "REPLACE_HETZNER_S3_SECRET_KEY"
  endpoint: "https://hel1.your-objectstorage.hetzner.com"
  region: "hel1"
