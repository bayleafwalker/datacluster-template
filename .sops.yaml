creation_rules:
  # Talos cluster configuration
  - path_regex: talos/cluster\.yaml$
    encrypted_regex: ^(ipAddress|endpoint|token|caPem|certificate|key|secret|REPLACE_.*)$
    age: >-
      age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  
  # Terraform variables (terraform-v2/ is active)
  - path_regex: terraform(-v2)?/.*\.tfvars$
    age: >-
      age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  
  # Kubernetes secrets
  - path_regex: infrastructure/.*/.*secret.*\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  
  # Encrypted files (*.enc extension)
  - path_regex: .*\.enc$
    age: >-
      age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# REPLACE WITH YOUR OWN AGE KEY!
# 
# Generate with: age-keygen -o age.key
# Then replace all instances of age1xxx... above with your public key
# 
# Public key example: age1ulmhqhp2t2x9pte5n4e06sc809ucful63k0u30v2np40d2sa53pq2wuv0l
# 
# Usage:
#   Encrypt: sops --encrypt --in-place <file>
#   Decrypt: sops -d <file>
#   Edit: sops <file>
