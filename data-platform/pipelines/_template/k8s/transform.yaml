---
# SparkApplication for Transform Stage
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: pipeline-name-transform
  namespace: spark-operator
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "ghcr.io/<user>/datacluster-data:0.1.0"  # TODO: Update image
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///app/pipelines/_template/src/transform.py  # TODO: Update path
  sparkVersion: "3.5.0"
  
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20
  
  driver:
    cores: 2
    coreLimit: "2400m"
    memory: "4096m"
    labels:
      version: "3.5.0"
      pipeline: "pipeline-name"
      stage: "transform"
    serviceAccount: spark-operator
    
    resources:
      requests:
        cpu: "1000m"
        memory: "4Gi"
      limits:
        cpu: "2400m"
        memory: "4Gi"
  
  executor:
    cores: 2
    instances: 4  # More executors for heavy transformations
    memory: "4096m"
    labels:
      version: "3.5.0"
      pipeline: "pipeline-name"
      stage: "transform"
    
    resources:
      requests:
        cpu: "1000m"
        memory: "4Gi"
      limits:
        cpu: "2500m"
        memory: "4Gi"
  
  sparkConf:
    "spark.ui.prometheus.enabled": "true"
    "spark.executor.processTreeMetrics.enabled": "true"
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.sql.shuffle.partitions": "200"
    # Delta Lake configuration
    "spark.sql.extensions": "io.delta.sql.DeltaSparkSessionExtension"
    "spark.sql.catalog.spark_catalog": "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    # S3 configuration
    "spark.hadoop.fs.s3a.endpoint": "https://hel1.your-objectstorage.hetzner.com"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.path.style.access": "true"
  
  hadoopConf:
    "fs.s3a.access.key": "${S3_ACCESS_KEY}"
    "fs.s3a.secret.key": "${S3_SECRET_KEY}"
  
  monitoring:
    exposeDriverMetrics: true
    exposeExecutorMetrics: true
    prometheus:
      jmxExporterJar: "/prometheus/jmx_prometheus_javaagent-0.17.0.jar"
      port: 8090
  
  driver:
    envFrom:
      - secretRef:
          name: s3-credentials
  executor:
    envFrom:
      - secretRef:
          name: s3-credentials
