---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-storage
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/storage
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-monitoring
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infrastructure-storage
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/monitoring
  prune: true
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-spark-operator
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infrastructure-storage
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/spark-operator
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pipelines
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: infrastructure-spark-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./pipelines
  prune: true
